name: Windows tool regression
on:
  pull_request:
    paths:
      - 'server/**'
      - 'tests/windows-tools.test.mjs'
      - '.github/workflows/windows-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paths:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm ci
      - name: Install ephemeral runner media tools
        shell: pwsh
        run: |
          choco install ffmpeg exiftool --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          "$env:PATH" -split ';' | Where-Object { $_ } | ForEach-Object { $_ >> $env:GITHUB_PATH }
      - run: node --test --test-timeout=120000 tests/windows-tools.test.mjs
        env:
          WINDOWS_MEDIA_SMOKE: '1'
