name: Windows runtime regression
on:
  pull_request:
    paths:
      - 'server/**'
      - 'tests/windows-runtime.test.mjs'
      - '.github/workflows/windows-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paths:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm ci
      - run: choco install ffmpeg --yes --no-progress
      - run: npm run build
      - run: node --test --test-timeout=120000 tests/windows-runtime.test.mjs
